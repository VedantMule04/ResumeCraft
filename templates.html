<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Template</title>

    <link rel="stylesheet" href="templates.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">

        <h1>Choose Your Resume Template</h1>

        <div class="template-grid">

            <!-- Professional -->

            <div class="template-card">

                <img src="images/Professional_Resume.png"
                     alt="Professional Resume">

                <h3>Professional</h3>

                <button onclick="selectTemplate('professional')">
                    Select
                </button>

            </div>

            <!-- Modern -->

            <div class="template-card">

                <img src="images/Modern_Resume.png"
                     alt="Modern Resume">

                <h3>Modern</h3>

                <button onclick="selectTemplate('modern')">
                    Select
                </button>

            </div>

            <!-- Student -->

            <div class="template-card">

                <img src="images/Student_Resume.png"
                     alt="Student Resume">

                <h3>Student</h3>

                <button onclick="selectTemplate('student')">
                    Select
                </button>

            </div>

            <!-- Hybrid -->

            <div class="template-card">

                <img src="images/Hybrid_Resume.png"
                     alt="Hybrid Resume">

                <h3>Hybrid</h3>

                <button onclick="selectTemplate('hybrid')">
                    Select
                </button>

            </div>

        </div>

    </div>

    <script src="templates.js"></script>

</body>
</html>

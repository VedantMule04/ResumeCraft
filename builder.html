<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resume Builder</title>

<link rel="stylesheet" href="builder.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>
<body>

<div class="container">

    <h1>Create Your Resume</h1>

    <form id="resumeForm">

        <div class="section">

            <h2>Profile Photo</h2>

            <input type="file"
                   id="photo"
                   accept="image/*">

           <img id="previewImage"
     style="width:120px;
     height:120px;
     border-radius:50%;
     display:none;">

        </div>

        <div class="section">

            <h2>Personal Information</h2>

            <input type="text" id="name" placeholder="Full Name">

            <input type="text" id="title" placeholder="Professional Title">

            <input type="email" id="email" placeholder="Email">

            <input type="text" id="phone" placeholder="Phone Number">

            <input type="text" id="address" placeholder="Address">

            <input type="text" id="linkedin" placeholder="LinkedIn URL">

            <input type="text" id="github" placeholder="GitHub URL">

            <textarea id="objective"
            placeholder="Career Objective"></textarea>

        </div>

        <div class="section">

            <h2>Education</h2>

            <input type="text" id="college"
            placeholder="College Name">

            <input type="text" id="degree"
            placeholder="Degree">

            <input type="text" id="branch"
            placeholder="Branch">

            <input type="text" id="cgpa"
            placeholder="CGPA">

            <input type="text" id="year"
            placeholder="Passing Year">

        </div>

        <div class="section">

            <h2>Hard Skills</h2>

            <textarea id="hardSkills"
            placeholder="HTML, CSS, JavaScript"></textarea>

        </div>

        <div class="section">

            <h2>Soft Skills</h2>

            <textarea id="softSkills"
            placeholder="Leadership, Teamwork"></textarea>

        </div>

        <div class="section">

            <h2>Experience</h2>

            <textarea id="experience"
            placeholder="Work Experience"></textarea>

        </div>

        <div class="section">

            <h2>Projects</h2>

            <textarea id="projects"
            placeholder="Projects"></textarea>

        </div>

        <div class="section">

            <h2>Certifications</h2>

            <textarea id="certifications"
            placeholder="Certifications"></textarea>

        </div>

        <div class="section">

            <h2>Languages</h2>

            <input type="text"
            id="languages"
            placeholder="English, Hindi, Marathi">

        </div>

        <div class="section">

            <h2>Interests</h2>

            <input type="text"
            id="interests"
            placeholder="Cricket, Chess, Coding">

        </div>

        <button type="button"
                id="continueBtn">

            Continue →

        </button>

    </form>

</div>

<script src="builder.js"></script>

</body>
</html>
